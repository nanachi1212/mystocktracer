name: Pull Request Quality

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        run: npm ci

      - name: Set up Python snapshot helper
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test backend and frontend
        run: npm test

      - name: Vet backend
        working-directory: backend
        run: go vet ./...

      - name: Build backend
        working-directory: backend
        run: go build ./...

      - name: Test desktop and packaging contracts
        run: npm --workspace desktop test

      - name: Test tooling and provenance classification
        run: npm run test:tooling

      - name: Audit provenance evidence
        run: npm run audit:provenance -- --summary

      - name: Check whitespace
        run: git diff --check

      - name: Build frontend
        run: npm run build:frontend
