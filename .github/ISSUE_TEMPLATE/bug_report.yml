name: 問題回報
description: 協助定位 mystocktracer 的台股資料、介面或桌面執行問題
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        請使用可分享的合成資料描述問題。不要上傳金鑰、Cookie、持倉、資料庫或未遮罩的日誌。
        涉及安全漏洞時，請走 repository 的私密 Security 通道。
  - type: input
    id: version
    attributes:
      label: 版本或 commit SHA
      placeholder: 例如 v0.9.2
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 執行環境
      options: [Windows 11, Windows 10, macOS Apple Silicon, macOS Intel, Linux 或原始碼, 其他]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現方式
      description: 從啟動應用到看到問題，依時間順序列出操作。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 實際結果與預期結果
    validations:
      required: true
  - type: input
    id: market_evidence
    attributes:
      label: 資料來源與畫面日期
      description: 資料問題請註明 TWSE、TPEx、MOPS 等來源，以及交易日或 as_of。
  - type: textarea
    id: diagnostics
    attributes:
      label: 已去識別化的截圖或日誌
      description: 上傳前請再檢查帳號、路徑、持倉及模型憑證。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交確認
      options:
        - label: 我已移除個人與憑證資料，並確認不是重複 Issue。
          required: true
