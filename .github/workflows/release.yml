name: Desktop Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在且與 desktop/package.json 版本一致的發布 tag
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  quality:
    name: Verify tagged source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: node desktop/scripts/check-release-tag.mjs "$RELEASE_TAG"
      - run: npm test
      - run: npm --workspace desktop test
      - run: npm run test:tooling
      - run: npm run audit:provenance -- --summary
      - run: go vet ./...
        working-directory: backend

  packages:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: mac
            arch: arm64
            runner: macos-15
          - platform: mac
            arch: x64
            runner: macos-15-intel
          - platform: windows
            arch: x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    env:
      MYSTOCKTRACER_DESKTOP_ARCH: ${{ matrix.arch }}
      ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - run: npm ci
      - name: Build macOS assets
        if: matrix.platform == 'mac'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run release:mac
      - name: Build Windows assets
        if: matrix.platform == 'windows'
        env:
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run release:windows
      - name: Verify Windows update channel
        if: matrix.platform == 'windows'
        run: node desktop/scripts/verify-updater-artifacts.mjs desktop/dist/release latest.yml
      - name: Verify and retain macOS architecture channel
        if: matrix.platform == 'mac'
        run: |
          node desktop/scripts/verify-updater-artifacts.mjs desktop/dist/release latest-mac.yml
          mv desktop/dist/release/latest-mac.yml desktop/dist/release/latest-mac-${{ matrix.arch }}.yml
      - uses: actions/upload-artifact@v4
        with:
          name: mystocktracer-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop/dist/release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish verified assets
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: mystocktracer-*
          path: release-assets
          merge-multiple: true
      - name: Assemble and verify complete download and updater set
        run: |
          node desktop/scripts/merge-mac-updater-metadata.mjs release-assets
          node desktop/scripts/verify-updater-artifacts.mjs release-assets latest-mac.yml latest.yml
          node desktop/scripts/prepare-publish-assets.mjs release-assets publish-assets "$RELEASE_TAG"
          node desktop/scripts/verify-updater-artifacts.mjs publish-assets/github latest-mac.yml latest.yml
      - name: Record download checksums
        working-directory: publish-assets/github
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash desktop/scripts/publish-github-release.sh "$RELEASE_TAG" publish-assets/github ".github/release-notes/$RELEASE_TAG.md"
