name: 維護與改進建議
description: 說明現有台股研究流程中的具體阻礙
title: "[Proposal] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        mystocktracer 目前以維護和來源整理為主。請先描述現有功能遇到的問題，避免提交任何私人帳戶或持倉資料。
  - type: textarea
    id: workflow
    attributes:
      label: 目前的研究流程與阻礙
      description: 何時發生、會影響哪個判斷或操作？
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 希望看見的行為
      description: 描述可驗收的結果，不需要指定程式架構。
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: 相關介面
      options: [每日總覽, 自選股或持倉, 事件提醒, 個股或 AI 研究, 資料來源, 桌面安裝或更新, 文件, 其他]
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: 資料與相容性影響
      description: 說明是否涉及來源、單位、交易日、Point-in-Time、既有本機資料或第三方服務；沒有請填「無」。
    validations:
      required: true
  - type: textarea
    id: provenance
    attributes:
      label: 外部來源與授權
      description: 若附上外部程式碼或素材，提供來源連結與授權資訊；沒有請填「無」。
    validations:
      required: true
